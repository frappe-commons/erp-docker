name: Unit tests

on:
  push:
    branches:
      - main
    paths:
      - development/installer.py
      - unit_tests/**
      - requirements-test.txt
      - .github/workflows/unit-tests.yml
  pull_request:
    branches:
      - main
    paths:
      - development/installer.py
      - unit_tests/**
      - requirements-test.txt
      - .github/workflows/unit-tests.yml
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Install test dependencies
        run: python -m pip install --requirement requirements-test.txt

      - name: Run unit tests
        run: python -m pytest --quiet unit_tests
