name: Unit tests

on:
  push:
    branches:
      - main
    paths:
      - .devcontainer/**
      - .gitattributes
      - development/dev-env.sh
      - development/installer.py
      - development/tests/**
      - tests/requirements.txt
      - .github/workflows/unit-tests.yml
  pull_request:
    branches:
      - main
    paths:
      - .devcontainer/**
      - .gitattributes
      - development/dev-env.sh
      - development/installer.py
      - development/tests/**
      - tests/requirements.txt
      - .github/workflows/unit-tests.yml
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tests/requirements.txt

      - name: Install test dependencies
        run: python -m pip install --requirement tests/requirements.txt

      - name: Validate development Compose configuration
        run: docker compose --file .devcontainer/docker-compose.yml config --quiet

      - name: Run unit tests
        run: python -m pytest --quiet development/tests
