name: ${COMPOSE_PROJECT_NAME:-frappe_development}

services:
  mariadb:
    image: docker.io/mariadb:10.6
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
      - --skip-innodb-read-only-compressed # Temporary fix for MariaDB 10.6
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-123}
      MARIADB_ROOT_PASSWORD: ${DB_PASSWORD:-123}
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 5s
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - mariadb-data:/var/lib/mysql

  redis-cache:
    image: docker.io/redis:alpine

  redis-queue:
    image: docker.io/redis:alpine

  frappe:
    image: docker.io/frappe/bench:latest
    user: root
    init: true
    command: ["bash", "/workspace/.devcontainer/start-development.sh"]
    depends_on:
      mariadb:
        condition: service_healthy
      redis-cache:
        condition: service_started
      redis-queue:
        condition: service_started
    environment:
      APPS_JSON: ${APPS_JSON:-}
      SITES_JSON: ${SITES_JSON:-}
      BACKUP_URL: ${BACKUP_URL:-}
      # Use Codex's canonical home so the CLI and editor integrations share
      # one persistent session store across container rebuilds.
      CODEX_HOME: /home/frappe/.codex
      HOST_CLI_PATH: /home/frappe/.host-cli/bin
      SHELL: /bin/bash
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-1212}
      DB_PASSWORD: ${DB_PASSWORD:-123}
      FRAPPE_API_TOKEN: ${FRAPPE_API_TOKEN:-}
      FRAPPE_BRANCH: ${FRAPPE_BRANCH:-version-16}
      # Keep unattended setup non-interactive while leaving host-specific SSH
      # routing and identity selection to the mounted host configuration.
      GIT_SSH_COMMAND: ssh -o BatchMode=yes
      SOURCE_SITE_URL: ${SOURCE_SITE_URL:-}
      SSH_AUTH_SOCK: /run/host-services/ssh-auth.sock
    volumes:
      - ..:/workspace:cached
      # Share host-installed user CLIs without exposing the entire host home.
      - ${HOME}/.cargo/bin:/opt/host-cli/cargo/bin:ro
      - ${HOME}/.local/bin:/opt/host-cli/local/bin:ro
      - ${HOME}/.nvm:/opt/host-cli/nvm:ro
      - type: bind
        source: ${HOST_CODEX_HOME:-${HOME}/.codex}
        target: /home/frappe/.codex
      - ${HOME}/.tokensave:/opt/host-cli/state/tokensave
      # Preserve host SSH behavior, including aliases, Include files,
      # certificates, and IdentityFile paths. The tree is read-only; Dev
      # Containers also forwards the host agent on Linux, macOS, and Windows.
      - type: bind
        source: ${HOST_SSH_AUTH_SOCK:-${SSH_AUTH_SOCK:-/dev/null}}
        target: /run/host-services/ssh-auth.sock
      - type: bind
        source: ${HOST_SSH_DIR:-${HOME}/.ssh}
        target: /home/frappe/.ssh
        read_only: true
      # Host-built ELF CLIs may require a newer glibc than the image provides.
      - /lib/x86_64-linux-gnu:/opt/host-cli/lib:ro
    working_dir: /workspace/development
    ports:
      - "${HTTP_PORT:-8000}:8000"
      - "${SOCKETIO_PORT:-9000}:9000"
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/frappe-bench-setup-complete"]
      start_period: 30m
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  mariadb-data:
